# gcovr configuration — read automatically from the repository root.
#
# The anchors are (.*/)? and not .*/ on purpose. A gcovr pattern that does not
# look absolute is matched against the RELATIVE path, and a build tree sitting
# beside the sources is "build/..." with no leading slash: `.*/build/.*` misses
# it entirely. Measured on one tree, same data, anchor changed:
#   exclude = .*/cov/.*      ->  99 rows, 2 generated files survived
#   exclude = (.*/)?cov/.*   ->  80 rows, 0 survived
# and without any of this the same run reported 28252 lines at 36% where the
# truth was 9300 at 40%.

exclude-throw-branches       = yes
exclude-unreachable-branches = yes
exclude-noncode-lines        = yes

exclude = (.*/)?build[^/]*/.*
exclude = (.*/)?_deps/.*
exclude = (.*/)?thirdparty/.*
exclude = (.*/)?tests?/.*
exclude = (.*/)?e2e/.*
exclude = .*_test\.cpp$
exclude = .*Test\.cpp$
exclude = (.*/)?fuzz/.*
exclude = (.*/)?bench/.*
exclude = (.*/)?examples/.*
