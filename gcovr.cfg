# gcovr configuration — read automatically from the repository root.
#
# The anchors are (.*/)? and not .*/ on purpose. A gcovr pattern that does not
# look absolute is matched against the RELATIVE path, and a build tree sitting
# beside the sources is "build/..." with no leading slash: `.*/build/.*` misses
# it entirely. The anchor decides whether the exclude matches at all: with
# an unanchored pattern the generated files under a build tree beside the
# sources survive the filter and are counted as project source, and the
# totals then describe the build tree rather than the code this repository
# writes.

exclude-throw-branches       = yes
exclude-unreachable-branches = yes
exclude-noncode-lines        = yes

exclude = (.*/)?build[^/]*/.*
exclude = (.*/)?_deps/.*
exclude = (.*/)?thirdparty/.*
exclude = (.*/)?tests?/.*
exclude = (.*/)?e2e/.*
exclude = .*_test\.cpp$
exclude = .*Test\.cpp$
exclude = (.*/)?fuzz/.*
exclude = (.*/)?bench/.*
exclude = (.*/)?examples/.*
