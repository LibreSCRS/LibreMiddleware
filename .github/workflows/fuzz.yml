#
# Short libFuzzer smoke session per pull request, and a real soak on the
# weekly cron: 60 s per harness on a pull request, 900 s on the schedule.
# Crashes are uploaded as artifacts; jobs fail on any libFuzzer-reported
# finding. Not on push: fifteen harnesses cost two hours of runner time, and a
# change reaches main through a pull request, where this already ran.

name: Fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:00 UTC — the longer soak, fifteen minutes per harness.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  libfuzzer:
    name: libFuzzer / ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A job that hangs serves no log at all while it runs, so a hung harness
    # would otherwise burn the six-hour default before anyone could see which
    # input did it.
    #
    # The number has to hold the soak AND everything before it, and the earlier
    # arithmetic did not: the fuzz step went from 60 s to 900 s (+14 min) while
    # this went from 20 to 25 (+5), which left the setup phase with ten minutes
    # instead of nineteen. That phase is a recursive checkout, an apt update and
    # ten packages, the LLVM repository and clang-21, a configure, and a build of
    # all fifteen harnesses at -j2. If it ever exceeds its share, the scheduled
    # leg dies at the ceiling and the soak this exists for never finishes. Forty
    # minutes keeps the setup phase's original headroom above a fifteen-minute
    # soak; it has not been measured in CI, because the schedule has never run.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        harness:
          - fuzz_parsed_certificate
          - fuzz_trusted_list_parser
          - fuzz_tl_signature_verifier
          - fuzz_pkcs15_parser
          - fuzz_emrtd_dg_parser
          - fuzz_csca_master_list
          - fuzz_emrtd_sod
          - fuzz_emrtd_card_access
          - fuzz_emrtd_security_info
          - fuzz_chunked_read
          - fuzz_pdf_parser
          - fuzz_asic_reader
          - fuzz_rs_tlv
          - fuzz_ber
          - fuzz_eu_vrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          # Full history so cmake's git-describe-derived version stamp
          # has tags to discover; otherwise configure logs a warning.
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld cmake ninja-build pkg-config \
            libcurl4-openssl-dev libssl-dev libxml2-dev libpcsclite-dev \
            uuid-dev openssl python3-jsonschema

      - name: Install clang-21 (for std::expected support)
        # Ubuntu 24.04 default `clang` ships against an older libstdc++
        # whose <expected> probe fails. Pin clang-21 to match the rest
        # of the LibreSCRS toolchain (CONTRIBUTING.md) and the
        # check-std-expected.cpp toolchain probe.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21

      - name: Configure
        # SIGNING_BACKEND stays at the default `native` — fuzz harnesses
        # target ParsedCertificate / TrustedListParser / TlSignatureVerifier,
        # none of which exercise the DSS test oracle. Avoids the JDK +
        # Maven toolchain dependency.
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          cmake -B build-fuzz -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBRESCRS_BUILD_FUZZ=ON \
            -DBUILD_TESTING=OFF

      - name: Build harness
        run: cmake --build build-fuzz --target ${{ matrix.harness }} -j2

      - name: Check that the harness instruments the code it fuzzes
        # The sanitizer flags are PRIVATE on the executable, so a harness that
        # only links the library under test fuzzes uninstrumented code and
        # reports nothing. This reads the objects back and refuses a harness
        # that is link-only without a written reason. Every harness is built
        # here so the whole declaration is measured, not just this leg's.
        run: |
          cmake --build build-fuzz -j2
          ./ci/scripts/check-fuzz-instrumentation.sh build-fuzz

      - name: Determine corpus path
        id: corpus
        # Mechanically derived, not listed. The corpus directory is the harness
        # name without its prefix for every harness here, so the case block was
        # a third copy of the matrix above -- and a harness added to the matrix
        # but forgotten there fuzzed from an empty path with nothing saying so.
        run: |
          harness="${{ matrix.harness }}"
          echo "path=fuzz/corpus/${harness#fuzz_}" >>$GITHUB_OUTPUT

      - name: Check that every harness has a seed directory
        # The set of corpus directories and the set of matrix entries must be
        # the same set. Without this a new harness silently starts from nothing,
        # which looks exactly like a harness that found nothing.
        run: |
          missing=0
          while IFS= read -r h; do
            d="fuzz/corpus/${h#fuzz_}"
            if [ ! -d "$d" ]; then
              echo "FAIL: $h has no seed directory at $d" >&2
              missing=1
            elif [ -z "$(find "$d" -type f ! -name 'README.md' -print -quit)" ]; then
              echo "FAIL: $d holds no seeds" >&2
              missing=1
            fi
          done < <(sed -n 's/^\([a-z0-9_]*\):.*/\1/p' fuzz/instrumented-sources.txt | sort -u)
          for d in fuzz/corpus/*/; do
            h="fuzz_$(basename "$d")"
            grep -q "^${h}:" fuzz/instrumented-sources.txt || {
              echo "FAIL: $d has seeds but $h is not declared" >&2
              missing=1
            }
          done
          # And the matrix above, which is a third list. A harness added to the
          # declaration, to CMake and to the corpus but not to the matrix passes
          # every other check here and is never fuzzed once -- the same class as
          # a harness with no seeds, left open for the matrix.
          declared=$(sed -n 's/^\([a-z0-9_]*\):.*/\1/p' fuzz/instrumented-sources.txt | sort -u)
          matrixed=$(sed -n 's/^          - \(fuzz_[a-z0-9_]*\)$/\1/p' .github/workflows/fuzz.yml | sort -u)
          if [ "$declared" != "$matrixed" ]; then
            echo "FAIL: the declaration and the job matrix name different harnesses:" >&2
            diff <(echo "$declared") <(echo "$matrixed") >&2 || true
            missing=1
          fi
          exit $missing

      - name: Run fuzzer
        # The header said the Monday run was a longer soak and then passed the
        # same sixty seconds every time, because nothing branched on the event.
        run: |
          mkdir -p fuzz-artifacts
          ./build-fuzz/fuzz/${{ matrix.harness }} \
            -max_total_time=${{ github.event_name == 'schedule' && 900 || 60 }} \
            -timeout=10 \
            -print_final_stats=1 \
            -artifact_prefix=fuzz-artifacts/ \
            ${{ steps.corpus.outputs.path }}

      - name: Upload crash artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.harness }}-crashes
          path: fuzz-artifacts/
