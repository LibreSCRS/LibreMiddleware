# SPDX-License-Identifier: LGPL-2.1
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      opensc_version:
        description: 'OpenSC version to build driver against (e.g. 0.26.1)'
        required: false
        default: '0.26.1'

env:
  OPENSC_VERSION: ${{ inputs.opensc_version || '0.26.1' }}

jobs:
  verify-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Import LibreSCRS release public key
        run: |
          gpg --import KEYS
          EXPECTED_FPR='6B05889AC9A6A7188DF639B06F27A989C2031D16'
          gpg --list-keys --with-colons "$EXPECTED_FPR" | grep -q "^pub" \
            || { echo "::error::Public key import failed or fingerprint mismatch"; exit 1; }

      - name: Verify tag signature
        run: git verify-tag "${{ github.ref_name }}"

  test-linux:
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libcurl4-openssl-dev libxml2-dev \
            cmake ninja-build python3-jsonschema

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --output-on-failure --test-dir build/test

  test-macos:
    needs: verify-signature
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ninja
          # manifest2header.py hard-fails when jsonschema is missing
          # (the schema gates the codegen step against malformed manifests).
          python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --output-on-failure --test-dir build/test

  pkcs11-linux:
    needs: [verify-signature, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libcurl4-openssl-dev libxml2-dev \
            cmake ninja-build python3-jsonschema

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target librescrs-pkcs11

      - name: Package
        run: scripts/linux/build-pkcs11-tar.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: pkcs11-linux
          path: librescrs-pkcs11-*.tar.gz

  pkcs11-macos:
    needs: [verify-signature, test-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install ninja
          # manifest2header.py hard-fails when jsonschema is missing
          # (the schema gates the codegen step against malformed manifests).
          python3 -m pip install --break-system-packages --user jsonschema

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_TESTING=OFF
          cmake --build build --target librescrs-pkcs11

      - name: Package
        run: scripts/macos/build-pkcs11-zip.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: pkcs11-macos
          path: librescrs-pkcs11-*.zip

  release:
    needs: [test-linux, test-macos, pkcs11-linux, pkcs11-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign artifacts with cosign (keyless via Sigstore OIDC)
        run: |
          find artifacts -type f \
            ! -name '*.sigstore.json' \
            -exec sh -c 'cosign sign-blob "$1" --bundle "$1.sigstore.json" --yes' _ {} \;

      - name: Create GitHub release with all signed artefacts
        # Replaces softprops/action-gh-release@v2 — that action races
        # between asset upload and metadata update; both rc1 attempts
        # failed at "error updating release asset metadata: HttpError:
        # Not Found" even though every `✅ Uploaded` line succeeded.
        # `gh release create` does it deterministically in a single
        # request that includes the assets, then exits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mark X.Y.Z-{rc,beta,alpha,…} as pre-release; everything else
          # is a stable release.
          PRERELEASE_FLAG=""
          case "${{ github.ref_name }}" in
              *-rc*|*-beta*|*-alpha*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # --repo lets `gh` skip the .git autodetection — release job
          # downloads artefacts but never checks out the repo, so there
          # is no `.git` directory.
          gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              $PRERELEASE_FLAG \
              artifacts/*
