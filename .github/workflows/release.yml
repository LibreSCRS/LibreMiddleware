# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# preflight -> build (tests, packages, source tarball) -> seal -> publish.
#
# A tag push publishes. A manual dispatch rehearses by default, on any ref: the
# preflight proves the tag verifier both ways on real and forged tags instead of
# verifying a tag that does not exist, the seal signs with an ephemeral key and
# uploads nothing to a transparency log, and the publish step keeps the asset
# set as a workflow artefact and reads it back the way it reads a published
# release. `publish` on a ref that is not a tag is refused in the first step.
# The shared steps live in LibreSCRS/ci, pinned by commit below.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # Everything a release can be refused for, before anything is built or
    # signed: the mode against the ref, the tag's signature, and the version
    # agreement (CHANGELOG, VERSION, the find_package floors, the stamped
    # version and the packaging surfaces).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          mode: ${{ inputs.mode || 'publish' }}
          version-min: '1'

  test-linux:
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Same ceiling as ci.yml's build-linux, for the same reason: an unbounded
    # ctest on a hosted runner can hold the job until GitHub's six-hour
    # default, and a release cut is the worst place to discover that.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libcurl4-openssl-dev libxml2-dev \
            cmake ninja-build python3-jsonschema

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        # --test-dir build, not build/test: several library subdirectories
        # register their own suites (lib/pkcs15/test, lib/plugin/test,
        # lib/pkcs11/test), and pointing ctest at build/test reads only
        # build/test/CTestTestfile.cmake -- so those ran nowhere.
        timeout-minutes: 30
        run: ctest --output-on-failure --test-dir build --no-tests=error

  shared-linux:
    # test-linux with LIBREMIDDLEWARE_BUILD_SHARED=ON, so the GNU ld version
    # script (cmake/librescrs-public-exports.map) is linker-exercised on every
    # release. The static build above never invokes it, so a public-symbol leak
    # or an accidentally hidden public symbol would otherwise first show when a
    # downstream consumer links the shared middleware.
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libcurl4-openssl-dev libxml2-dev \
            cmake ninja-build python3-jsonschema binutils

      - name: Configure & Build (Release, SHARED)
        run: |
          cmake -B build-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build build-shared

      - name: Check pimpl visibility (SHARED)
        run: ./ci/scripts/check-impl-visibility.sh build-shared

      - name: Verify SmartCard transmit-funnel export allowlist
        # Per the cmake/librescrs-public-exports.map header: only
        # CardSession::transmitInternal remains in the dynamic export set; the
        # legacy sessionTransmitImpl / detail::sessionTransmit are forbidden.
        run: |
          SO=build-shared/lib/LibreSCRS/libLibreSCRS_SmartCard.so
          test -f "$SO" || { echo "::error::missing $SO"; exit 1; }
          if nm -D --defined-only "$SO" | c++filt \
              | grep -E '(sessionTransmitImpl|detail::sessionTransmit)' ; then
              echo "::error::Forbidden sessionTransmit symbol leaked into shared LibreSCRS_SmartCard.so"
              exit 1
          fi
          nm -D --defined-only "$SO" | c++filt \
              | grep -F 'CardSession::transmitInternal' \
              || { echo "::error::Expected CardSession::transmitInternal export not found"; exit 1; }

      - name: Test
        timeout-minutes: 30
        run: ctest --output-on-failure --test-dir build-shared --no-tests=error

  test-macos:
    needs: [preflight]
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: |
          brew install ninja autoconf automake libtool pkg-config
          # manifest2header.py hard-fails when jsonschema is missing
          # (the schema gates the codegen step against malformed manifests).
          python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure & Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        timeout-minutes: 30
        run: ctest --output-on-failure --test-dir build --no-tests=error

  packages:
    # The binary artefacts this release publishes. Built here, in the release
    # run, rather than fetched from the CI run of the same commit: a
    # download-artifact without a run-id sees only its own run, and a release
    # that reaches into another run depends on that run's retention window.
    name: packages (${{ matrix.slug }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Seven to nine minutes of build per slug and a few more to install and
    # judge the result, measured locally at -j4. A wedged container must not
    # hold a release for six hours and refuse its log while it does.
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # The bottom of the stack: no upstream LibreSCRS package to fetch or
      # build first, so a tag and a rehearsal build the same way.
      - name: Build the packages for ${{ matrix.slug }}
        id: build
        uses: LibreSCRS/ci/actions/pkg-build@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          slug: ${{ matrix.slug }}
          upstream: source

      - name: Install them in a clean container and judge the result
        uses: LibreSCRS/ci/actions/pkg-verify@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report

      # Named <package>.<slug>.<deb|rpm> already, debug packages refused: the
      # asset set is decided by the builder, not by a rename here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ steps.build.outputs.dist }}
          # An empty upload is how a release publishes an empty SHA256SUMS and
          # calls it signed.
          if-no-files-found: error
          retention-days: 3

  source-tarball:
    # The source tarball is produced by this project, not by GitHub. GitHub's
    # archive/refs/tags tarball omits every submodule tree and its bytes are
    # not ours to assert; this one comes from a clone with --recurse-submodules
    # and is byte-identical run to run.
    needs: [preflight]
    runs-on: ubuntu-24.04
    # It pulls the two submodule trees (the vendored OpenSC and curl) over the
    # network, so the bound is loose; it exists so a stalled clone cannot hold
    # a runner for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build the source tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srctar"
          ci/scripts/make-source-tarball.sh "$RUNNER_TEMP/srctar"
          ls -l "$RUNNER_TEMP/srctar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tarball-artifacts
          path: ${{ runner.temp }}/srctar/*.orig.tar.gz
          # An empty upload here would make the release publish no source at
          # all. Fail where it is cheap.
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, test-linux, shared-linux, test-macos, packages, source-tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Used on a tag only: keyless signatures and the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        # merge-multiple is safe here: every package already carries its slug
        # in its name, and the builder refused a collision before anything was
        # uploaded.
        with:
          pattern: 'packages-*'
          merge-multiple: true
          path: artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts

      - name: Check out the source this release was cut from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A FULL checkout, not a sparse list: make-sbom.sh reads its pins out
          # of the tree, and a sparse list is a second, hand-maintained copy of
          # that input set. With submodules, because the bundled curl's version
          # is read from the curl tree itself; without it the bill silently
          # leaves curl out. Into a subdirectory, so artifacts/ above is kept.
          path: _src
          submodules: recursive
          persist-credentials: false

      - name: Bill of materials
        # Written here rather than left to a scanner: the shipped package
        # metadata says nothing about the statically linked OpenSSL, curl and
        # OpenSC, and this file is the only place their versions appear. Read
        # back from the directory a consumer downloads.
        run: |
          set -euo pipefail
          bash _src/ci/scripts/make-sbom.sh artifacts/sbom.cdx.json
          python3 _src/ci/scripts/check-sbom.py artifacts/sbom.cdx.json

      - name: Checksums, signatures and provenance
        uses: LibreSCRS/ci/actions/release-seal@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - name: Release notes, the asset set, and the release
        uses: LibreSCRS/ci/actions/release-publish@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}
