# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# preflight -> build (packages, source tarball) -> seal -> publish.
#
# A tag push publishes. Everything else rehearses: a manual dispatch (any ref),
# and a push to main or a ci/ branch that touches what the packages are built
# from -- the one path to the packages, so a change to them is built,
# installed in a clean container and judged before it lands. A rehearsal signs
# with an ephemeral key and uploads nothing to a transparency log, and keeps
# the asset set as a workflow artefact instead of publishing it. `publish` on a
# ref that is not a tag is refused in the first step. The tests are not run
# here again: the release is cut from a commit whose CI is green, which the
# release train checks before it tags. The shared steps live in LibreSCRS/ci,
# pinned by commit below.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    # Path filters are not applied to tag pushes; they choose which branch
    # pushes rehearse.
    branches: [main, 'ci/**']
    paths:
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - 'thirdparty/**'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'ci/release-assets.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # Everything a release can be refused for, before anything is built or
    # signed: the mode against the ref, the tag's signature, and the version
    # agreement (CHANGELOG, VERSION, the find_package floors, the stamped
    # version and the packaging surfaces).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          version-min: '1'

  packages:
    # The binary artefacts this release publishes. Built here, in the release
    # run, rather than fetched from the CI run of the same commit: a
    # download-artifact without a run-id sees only its own run, and a release
    # that reaches into another run depends on that run's retention window.
    name: packages (${{ matrix.slug }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Seven to nine minutes of build per slug and a few more to install and
    # judge the result, measured locally at -j4. A wedged container must not
    # hold a release for six hours and refuse its log while it does.
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # The bottom of the stack: no upstream LibreSCRS package to fetch or
      # build first, so a tag and a rehearsal build the same way.
      - name: Build the packages for ${{ matrix.slug }}
        id: build
        uses: LibreSCRS/ci/actions/pkg-build@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          slug: ${{ matrix.slug }}
          upstream: source

      - name: Install them in a clean container and judge the result
        uses: LibreSCRS/ci/actions/pkg-verify@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report
          # This repository's own installed-state assertions, in the same
          # container after the stack checks.
          hook: packaging/ci/verify-installed.sh

      # Named <package>.<slug>.<deb|rpm> already, debug packages refused: the
      # asset set is decided by the builder, not by a rename here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ steps.build.outputs.dist }}
          # An empty upload is how a release publishes an empty SHA256SUMS and
          # calls it signed.
          if-no-files-found: error
          retention-days: 3

  source-tarball:
    # The source tarball is produced by this project, not by GitHub. GitHub's
    # archive/refs/tags tarball omits every submodule tree and its bytes are
    # not ours to assert; this one comes from a clone with --recurse-submodules
    # and is byte-identical run to run.
    needs: [preflight]
    runs-on: ubuntu-24.04
    # It pulls the two submodule trees (the vendored OpenSC and curl) over the
    # network, so the bound is loose; it exists so a stalled clone cannot hold
    # a runner for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
          path: .ci
          persist-credentials: false

      - name: Build the source tarball
        run: |
          set -euo pipefail
          .ci/scripts/make-source-tarball --name librescrs-middleware --out "$RUNNER_TEMP/srctar"
          ls -l "$RUNNER_TEMP/srctar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tarball-artifacts
          path: ${{ runner.temp }}/srctar/*.orig.tar.gz
          # An empty upload here would make the release publish no source at
          # all. Fail where it is cheap.
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, packages, source-tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Used on a tag only: keyless signatures and the build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        # merge-multiple is safe here: every package already carries its slug
        # in its name, and the builder refused a collision before anything was
        # uploaded.
        with:
          pattern: 'packages-*'
          merge-multiple: true
          path: artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts

      - name: Check out the source this release was cut from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A FULL checkout, not a sparse list: make-sbom reads its pins out
          # of the tree, and a sparse list is a second, hand-maintained copy of
          # that input set. With submodules, because the bundled curl's version
          # is read from the curl tree itself; without it the bill silently
          # leaves curl out. Into a subdirectory, so artifacts/ above is kept.
          path: _src
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
          path: .ci
          persist-credentials: false

      - name: Bill of materials
        # Written here rather than left to a scanner: the shipped package
        # metadata says nothing about the statically linked OpenSSL, curl and
        # OpenSC, and this file is the only place their versions appear. Every
        # bundled component is required, so a pin that moved out of sight is a
        # refusal rather than a shorter bill.
        run: |
          set -euo pipefail
          .ci/scripts/make-sbom --root _src --repo LibreMiddleware --out artifacts/sbom.cdx.json \
            --require openssl --require curl --require opensc --require nlohmann-json --require miniz
          .ci/scripts/check-sbom artifacts/sbom.cdx.json

      - name: Checksums, signatures and provenance
        uses: LibreSCRS/ci/actions/release-seal@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - name: Release notes, the asset set, and the release
        uses: LibreSCRS/ci/actions/release-publish@261a41fb5b6dc060ab18e0ead6dd2b065755ed8e
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}
