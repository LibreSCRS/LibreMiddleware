# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Manual runs. Without this a job that is deliberately not part of every pull
  # request -- a coverage pass that takes an hour, say -- cannot be started at
  # all: a branch that is not a pull request gets no run, and a gate that cannot
  # be triggered is green by construction.
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-tags, deliberately. The recipe check run further down decides
      # its last arm on whether the LOCAL clone holds refs/tags/<pkgver>: with
      # a tagless checkout it prints SKIPPED forever, so a sha256sums that is
      # still a placeholder would outlive the release it waits for and no run
      # would ever say so. This checkout already asks for the whole history,
      # which carries the tags with it; the flag is here so the arm survives
      # someone shortening the fetch later.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the scope check below
        # reads too: a directory nobody formats cannot appear without one of
        # these two steps saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # A wedged job in this project once held a runner until it was cancelled by hand.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      - name: Check every tracked source is reachable by the formatter
        run: ./ci/scripts/check-format-scope.sh

      - name: Check every skip carries a reason
        # A test that skips without saying why is indistinguishable from a test
        # that passed. Costs a second and builds nothing.
        run: ./ci/scripts/check-skip-reasons.sh

      - name: BIGNUM deleters cleanse, and say why
        # PACE ephemeral private keys exist only as a BIGNUM and no CleanseGuard
        # reaches them. This was fixed in 4.1.0 and silently undone by a
        # deduplication pass that matched two deleters on their names. Checks
        # the call and the recorded reason as two separate failures.
        run: ./ci/scripts/check-cleansing-deleters.sh

      - name: BIGNUM deleter gate can still tell red from green
        run: ./ci/scripts/check-cleansing-deleters.selftest.sh

      - name: Changelog and version agree on the pending release
        # Run on every push with the version this tree is heading for, so the
        # agreement is proved weeks before the tag rather than first on a tag
        # that cannot be taken back. The release job calls the same script with
        # the tag's version.
        run: ci/scripts/check-release-lockstep.sh "$(head -n1 VERSION | tr -d '[:space:]')"

      - name: Every job carries a time bound
        # An unbounded job that hangs holds a runner for six hours and will
        # not serve its log until the run is cancelled, so the failing test
        # cannot even be named. This fails when a new job arrives without a
        # bound, which is the only moment the omission is cheap to fix.
        run: ci/scripts/check-job-timeouts.sh

      - name: Every shipped gate is wired into CI
        # A gate nobody runs is not a gate: dup-scan.py and canonical-types.py
        # shipped here, self-tested and green, while no workflow in this
        # repository named either until this step arrived.
        run: ci/scripts/check-gates-wired.sh

      - name: Gate-wiring check self-test
        run: ci/scripts/check-gates-wired.selftest.sh

      - name: Canonical declaration registry
        # Single-checkout subset of the workspace scan. The cross-repository
        # half -- duplicate bodies between two checkouts -- needs every tree
        # side by side, which no single repository's CI has; this half is the
        # part one repository can prove on its own.
        run: python3 tools/canonical-types.py --repo "$(basename "$PWD")"

      - name: Duplicate bodies (this checkout)
        run: python3 tools/dup-scan.py --repo "$(basename "$PWD")"

      - name: Every first-party version floor names the major in VERSION
        # The 4.x sweep before 5.0 searched for the token `4.2`; the floor that
        # mattered read `4.0`, in the only executable consumer the project
        # ships, and survived. This measures the property instead: every
        # first-party find_package/find_dependency floor must name the major
        # the VERSION file names. It reads VERSION and never `git describe`, so
        # it is decidable before a tag exists -- which is the whole window in
        # which the mistake is cheap. --min 1 is the vacuum guard: a scan that
        # matches nothing is unmeasured, not clean.
        run: ci/scripts/check-version-floors.sh --min 1

      - name: Prove the floor gate still fails when it should
        # Instant, no build, every case two-sided. A gate nobody has seen fail
        # is a line in a workflow file. The count is deliberately not written
        # here: a number in a comment goes stale the first time the selftest
        # grows, and the run itself already prints one line per case.
        run: ./ci/scripts/check-version-floors.selftest.sh

      - name: The version this tree stamps names the major in VERSION
        # The floor gate reads VERSION and the sources, so it stays green
        # whatever the version derivation does, and a check that configures
        # with git switched off is measuring the one input under which a tag
        # cannot win. Between code freeze and the tag `git describe` still
        # answers with the PREVIOUS release, and a tree that lets it decide
        # installs a package whose major contradicts its own VERSION, changelog
        # and packaging. This configures the real CMakeLists against a stubbed
        # tag, in both directions, and creates no tag anywhere.
        run: ci/scripts/check-version-stamp.sh --verbose

      - name: Prove the stamp gate still fails when it should
        # Seven fixtures, no compiler, no build. Two of them are shapes that
        # have really been written: the tag deciding unconditionally, and git
        # being ignored altogether.
        run: ./ci/scripts/check-version-stamp.selftest.sh

      - name: Every artefact a release publishes has a producer in the same run
        # release.yml downloaded artefacts that no job in that workflow
        # uploaded. download-artifact succeeds on an empty match, so the
        # failure surfaced four steps later as `find: 'artifacts': No such
        # file or directory` -- on a tag, which is the one moment it cannot be
        # taken back. This reads the pairing on every push instead.
        run: ci/scripts/check-release-artifacts.sh

      - name: The artefact-producer check can still fail
        # A gate whose own failure path is never exercised is a gate on trust.
        # Thirteen synthetic workflows: three a naive grep would pass, two
        # that a check reading only the direct needs: line gets wrong the other
        # way round, and two that a check reading the pairing per job rather
        # than per artefact gets wrong.
        run: ./ci/scripts/check-release-artifacts.selftest.sh

      - name: Prove the version-surface check still fails when it should
        run: ./ci/scripts/check-version-surfaces.selftest.sh

      - name: Every surface states the version in VERSION
        # The build's project() stamp, the Debian changelog and the RPM spec,
        # each against the version file: a package labelled one version must
        # not install a binary that calls itself another.
        run: ./ci/scripts/check-version-surfaces.sh

      - name: The release-asset check can still fail
        # Twenty-three cases over the three arms, including the two that must
        # say "cannot judge" rather than pass: a staging directory that was
        # promised and does not exist, and a draft under --published-strict.
        run: ./ci/scripts/check-release-assets.selftest.sh

      - name: The release workflow checks its asset set before publishing
        # Structural only: the job that runs gh release create runs the
        # --staged check before it. Whether the set is right is measured on the
        # tag, over the files themselves.
        run: ./ci/scripts/check-release-assets.sh --wired

      - name: The package matrix is the same in both workflows
        # The three pinned images are written twice, because a job that calls a
        # reusable workflow cannot carry timeout-minutes and the job-bound
        # check requires one on every job. Two copies of a digest drift, and a
        # release built on an image no push was ever tested against says
        # nothing about it: the packages appear, every gate is green.
        run: ci/scripts/check-package-matrix.sh

      - name: The package-matrix check can still fail
        run: ./ci/scripts/check-package-matrix.selftest.sh

      - name: The bill-of-materials refusal can still fail
        # The bill's producer runs in the release job and nowhere else, so its
        # refusal to publish a document listing nothing first turns red on the
        # one run that must not fail. check-sbom.py makes the same claim about
        # the finished document, and these cases make it on every push: six
        # shapes a bill can take while still being a file a release would sign.
        run: ./ci/scripts/check-sbom.selftest.sh
      - name: The Arch recipe fetches the tarball this project publishes
        # Two scripts, because a gate nobody proves is a gate nobody trusts:
        # the selftest perturbs the recipe -- and the tree around it -- and
        # requires each refusal to name its own arm, then the gate runs over
        # the committed recipe. It prints how many cases it ran, which is the
        # only count that cannot go stale.
        # Neither touches the network — `git ls-remote` against these SSH
        # remotes hangs on a developer machine, and a gate that can hang is
        # worse than one that can fail.
        run: |
          ./packaging/arch/check-recipe.selftest.sh
          ./packaging/arch/check-recipe.sh

      - name: Every uploaded artefact has someone to download it
        # An artefact whose name no download step can match is built, kept for
        # ninety days and dropped from the release without a word: the release
        # simply carries one asset fewer. Names only -- whether the consumer is
        # ordered after the producer is the needs question, which this
        # repository answers only if it carries check-release-artifacts.sh.
        run: |
          ./ci/scripts/check-artifact-names.selftest.sh
          ./ci/scripts/check-artifact-names.sh

      # A step can land in a job that does not run on push, or before the
      # checkout that creates the directory its working-directory names, and
      # nothing says so: the wiring check sees the name and the timeout check
      # sees the bound. This reads the workflows as data and fails on both.
      - name: Every step can run where it was placed
        run: ./ci/scripts/workflow-step-order.py

  build-linux:
    # Two signing backends. `native` is the production path and carries the
    # release gates; `both` additionally compiles the DSS cross-verification
    # oracle so cross_backend_test.cpp — gated on
    # `LIBRESIGN_HAS_NATIVE && LIBRESIGN_HAS_DSS`, and therefore never built by
    # any job before this matrix existed — is actually exercised.
    name: build-linux (${{ matrix.signing_backend }})
    runs-on: ubuntu-latest
    # GitHub's default job ceiling is six hours. A deadlocked test once held
    # this job for two hours and forty-nine minutes before a human noticed;
    # the per-test ctest timeout in the root CMakeLists.txt is what names the
    # culprit, and this is the backstop for anything that outlives it (a leaked
    # grandchild holding the output pipe, an apt or clone that stalls). The
    # number is a ceiling, not a budget: well above what dependencies + OpenSC
    # from source + a full Release build + the suite need, and far enough below
    # six hours that a wedge is somebody's problem the same morning.
    timeout-minutes: 75
    strategy:
      # Each backend must report independently: a `both`-only regression should
      # not mask the production leg's result, and vice versa.
      fail-fast: false
      matrix:
        include:
          - signing_backend: native
            # The DSS oracle shells out to a Java JAR. Kept on for the native
            # leg only because that is where it already ran.
            dss_oracle: 'ON'
            release_gates: true
          - signing_backend: both
            # No Java on the runner: the oracle would be built and never
            # usable. Off here, while the DSS *backend* itself still compiles
            # and the cross-backend cases still run.
            dss_oracle: 'OFF'
            release_gates: false
    env:
      OPENSC_VERSION: '0.26.1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema \
            softhsm2 opensc clang \
            poppler-utils

      - name: Build OpenSC ${{ env.OPENSC_VERSION }} from source
        run: |
          git clone --branch ${{ env.OPENSC_VERSION }} --depth 1 \
            https://github.com/OpenSC/OpenSC /tmp/opensc-src
          cd /tmp/opensc-src
          ./bootstrap
          ./configure --prefix=/tmp/opensc-install \
            --enable-shared --disable-static --without-readline
          make -j$(nproc) install

      - name: Install clang-21 for the layout snapshot
        # The layout snapshot dumps record layouts with clang. The runner's
        # default clang crashes inside <type_traits> of the system libstdc++
        # while doing that under -std=c++23, and the baseline was recorded
        # with a newer clang, so the snapshot is taken with the same major
        # the format check already installs, from the same repository.
        if: matrix.release_gates
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21

      # The compiler the warning baseline's key names, installed explicitly and
      # named through CC/CXX. Without it the key is whatever the image happens to
      # ship on the day, and `--require-key` turns that drift into a failure
      # nobody caused -- the same step, for the same reason, as the one the
      # coverage job already carries.
      - name: Pin the compiler the warning baseline is keyed to
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Configure & Build (Release, warnings as errors)
        # Release matches what users receive — same `-O2 -DNDEBUG` code
        # path runs in production and in the local pre-tag verification
        # pass. Debug coverage lives in the developer workflow; the CI
        # gate exists to catch regressions in the shipped configuration.
        # SIGNING_BACKEND is bare (declared in `lib/libresign/CMakeLists.txt`,
        # not namespaced) and BUILD_TESTING defaults ON, so neither is spelled
        # with a project prefix here.
        #
        # LIBREMIDDLEWARE_WERROR covers the shipped libraries and card plugins
        # only: the vendored miniz translation unit, the fetched googletest and
        # this repo's test executables are all left warning-only, so a compiler
        # upgrade cannot fail this build through a diagnostic no change here
        # could fix. Set on both matrix legs — `both` compiles the DSS backend
        # sources that `native` does not. Deliberately not set on the macOS
        # job: the clean baseline this gate rests on was measured with GCC, and
        # AppleClang's diagnostic set is a different one that has never been
        # surveyed. Build type and the option are pinned together here so a
        # later edit to one cannot quietly disarm the other.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/opensc-install \
            -DOPENSC_INCLUDE_DIR=/tmp/opensc-src/src \
            -DSIGNING_BACKEND=${{ matrix.signing_backend }} \
            -DBUILD_DSS_ORACLE=${{ matrix.dss_oracle }} \
            -DLIBREMIDDLEWARE_WERROR=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # set -o pipefail is explicit: without it `| tee` reports tee's status
          # and a failed build becomes a green step, after which the warning
          # check measures a log that was never produced.
          set -o pipefail
          LC_ALL=C cmake --build build 2>&1 | tee build.log

      - name: No file on the include path can stand in for a standard header
        # On a case-insensitive file system a file named VERSION in an include
        # directory IS <version>, and the standard library's own include opens
        # it. This file system never shows that, so the macOS build used to be
        # the first to find out; this reads every include directory the
        # compiler is handed and fails on the name instead.
        run: ./ci/scripts/check-include-shadowing.py build

      - name: The warning floor is still reachable
        # warning-gate.py judges the LOG, so a tree that has LOST compile units
        # makes it refuse every full build and blame the build. This judges the
        # configured graph instead, so the message names the stale number.
        run: ./ci/scripts/check-warning-floor.sh build

      - name: Warning-floor check self-test
        run: ./ci/scripts/check-warning-floor.selftest.sh

      - name: EMRTDCrypto include-list gate self-test
        # The gate itself is the configure-time check at the end of the
        # top-level CMakeLists.txt, so this job's own configure above already
        # ran it. This proves it can fail: on a throw-away copy of the tracked
        # tree, a directory added to the target outside the shared module
        # fails the configure and a comment does not. One leg is enough.
        if: matrix.release_gates
        run: ./ci/scripts/emrtd-include-gate.selftest.sh

      # Every self-test in this repository, by pathspec, and each one must
      # report the cases it ran and how many proved the gate red. A self-test
      # nothing runs proves as much as no self-test, and a runner that read only
      # exit codes would accept `exit 0` as a body.
      #
      # Here rather than in format-check, which builds nothing: one of these
      # self-tests reads the SHIPPED libLibreSCRS_Signing.so -- it asserts the
      # real library still links the PKCS#11 loader, and strips that same
      # library to prove a stripped artefact is refused -- so without a build
      # tree it says "cannot judge" and takes the whole runner with it. The
      # honest fix is the tree, not a skip: a skipped case conceals whatever
      # precondition broke next. BUILD_DIR is how the runner hands a built tree
      # to the self-tests that need one; the rest ignore it.
      #
      # Both matrix legs on purpose. `native` and `both` link different signing
      # backends into that same library, and this job's rule is that each
      # backend reports for itself.
      - name: Run every self-test
        env:
          BUILD_DIR: build
        run: ./ci/scripts/run-selftests.sh

      - name: Check the warning baseline
        # Counted by the [-Wname] tag, never by the message text: diagnostics
        # are localised. --require-key means a compiler the baseline has no
        # section for FAILS rather than being reported: the sentence that used to
        # stand here -- "an unknown compiler is reported, not failed" -- described
        # the behaviour this flag removed. That is only a usable rule if the key
        # cannot drift, which is what the pin above is for.
        run: ./ci/scripts/warning-gate.py --check --require-key build.log --build-dir build

      - name: Verify the configured signing backend took effect
        # Runs on every leg — this is the matrix's own integrity check, not a
        # release gate. SIGNING_BACKEND's cached STRINGS property is advisory,
        # so a misspelled flag name above would not fail configure: CMake would
        # record the stray variable, keep the "native" default, and this job
        # would pass forever while silently testing one backend twice.
        run: ./ci/scripts/check-signing-backend.sh build ${{ matrix.signing_backend }} ${{ matrix.dss_oracle }} ON

      - name: Check the discovered test set
        # Runs on every leg. The two backends register different suites from
        # the same commit, so one committed listing per leg is the only shape
        # that can be compared; a matrix expression is correct here precisely
        # because this is the one job in this project that has a matrix.
        run: ./ci/scripts/test-manifest-gate.sh --check build ${{ matrix.signing_backend }}

      - name: Check pimpl visibility
        if: matrix.release_gates
        run: ./ci/scripts/check-impl-visibility.sh build

      - name: Check raw PC/SC open confinement
        if: matrix.release_gates
        # Production code must open the card via CardSession::open (single
        # session per reader); only the diagnostic tools/tests may use the
        # PCSCConnection::openRawDiagnostic escape hatch.
        run: ./ci/scripts/check-raw-pcsc-open.sh

      - name: Prove the raw PC/SC open gate still fails when it should
        if: matrix.release_gates
        # The gate above is a recursive grep, and a grep that finds nothing
        # looks the same whether the tree is clean or empty -- it printed OK for
        # a tree with no sources in it. Three of these four cases prove a red.
        run: ./ci/scripts/check-raw-pcsc-open.selftest.sh

      - name: Check pinned TL cert expiry
        if: matrix.release_gates
        # Pre-empt the runtime hard-fail in tl_signature_verifier.cpp by
        # alerting (build break) ~3 months before any pinned TL signing
        # certificate's notAfter date, giving a comfortable rotation
        # window for the cert refresh + release cut.
        run: ./ci/check-pinned-cert-expiry.sh

      - name: Check vendored archive provenance
        if: matrix.release_gates
        # The bundled OpenSSL is four committed binaries, not a source tree.
        # Each archive carries the version, target, compiler line and build
        # date it was produced with; this reads those back out and compares
        # them with thirdparty/openssl-*/PROVENANCE.txt. A bump that moves the
        # archives and forgets the record, or moves only one platform's, fails
        # here without anything being tampered with.
        run: ./ci/scripts/check-vendored-provenance.sh

      - name: Prove the provenance check can fail
        if: matrix.release_gates
        run: ./ci/scripts/check-vendored-provenance.selftest.sh

      - name: Check the bundled licence texts against the manifest
        if: matrix.release_gates
        # thirdparty/licenses.json pins a digest per bundled licence file and
        # nothing recomputed them: moving the curl submodule changed its COPYING
        # and the manifest went on asserting the previous one.
        run: ./ci/scripts/check-bundled-licenses.sh

      - name: Prove the licence check can fail
        if: matrix.release_gates
        run: ./ci/scripts/check-bundled-licenses.selftest.sh

      - name: Check ABI snapshot vs 5.x baseline
        # Native leg only: the baseline is recorded for one configuration, and
        # `both` adds the DSS backend's exported symbols, so running it there
        # would report a delta that is not a regression.
        if: matrix.release_gates
        # 5.x baseline — minor-version additions tracked; removals or
        # signature drift forbidden. Additions land via an intentional
        # baseline regeneration (`abi-snapshot.sh --update`) reviewed in
        # the same commit as the new public symbol.
        run: ./ci/scripts/abi-snapshot.sh --check build

      - name: Check ABI layout vs baseline
        # Native leg only: member offsets and vtable slot order are facts about
        # one toolchain, and this is the leg that owns the canonical
        # configuration for the symbol snapshot beside it.
        if: matrix.release_gates
        # Reads the public headers with clang; needs no build, costs seconds.
        # A baseline line that disappears is the failure — a size that moved, an
        # offset that shifted, a slot whose occupant changed. None of those
        # reach the symbol snapshot above, because an inline member emits no
        # symbol at all.
        run: ./ci/scripts/abi-layout.sh --check build
        env:
          CXX: clang++-21

      - name: Upload ABI layout snapshot
        # A layout difference is unreadable from its exit code alone; the first
        # thing anyone needs is the file the runner actually saw.
        if: failure() && matrix.release_gates
        uses: actions/upload-artifact@v4
        with:
          name: abi-layout-snapshot
          path: build/abi-layout-snapshot.txt

      - name: Bootstrap SoftHSM2 test token
        # Provisions the isolated token store the CAdES/PAdES/JAdES/XAdES/
        # ASiC-E, NativeSigningService and Pkcs11ModuleManager suites need —
        # without it they GTEST_SKIP() outright (findSoftHsmPath() /
        # findSoftHsmTestSlot() come up empty). Exports SOFTHSM2_CONF and
        # SOFTHSM2_LIB via $GITHUB_ENV so the Test step below inherits them.
        run: ./ci/scripts/softhsm-bootstrap.sh

      - name: Set up Java for the ETSI validation oracle
        # Only the leg that compiles the oracle in. The other one would download
        # a JDK it never opens.
        if: matrix.dss_oracle == 'ON'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the ETSI validation oracle
        # The oracle's build output is git-ignored and no job ever ran Maven, so
        # on this leg the test environment printed that the archive was missing
        # and carried on -- every validation call returned without asserting
        # anything, on every push, since the oracle was written.
        #
        # No continue-on-error, deliberately: a gate allowed to skip itself is
        # the failure being fixed here. Measured locally on this change: 35s
        # cold against the job's 75-minute ceiling, and the cache key covers
        # the project file so a validator version bump invalidates it.
        if: matrix.dss_oracle == 'ON'
        timeout-minutes: 10
        run: mvn -q -B -DskipTests -f tools/dss-service/pom.xml package

      - name: Test
        # No LIBRESCRS_TEST_PIN — CI runner has no smart card. PIN-gated
        # tests skip cleanly via g_pinFailed / SKIP_IF_PIN_FAILED. Real-
        # card validation happens locally on a developer machine before
        # tag.
        # --test-dir build, not build/test: several library subdirectories
        # register their own suites (lib/pkcs15/test, lib/plugin/test,
        # lib/pkcs11/test), and pointing ctest at build/test reads only
        # build/test/CTestTestfile.cmake -- so those ran nowhere. Scoping to
        # the build ROOT runs everything that was built, which is the only
        # scope that cannot silently shed a suite again. Measured on this
        # change: 1409 -> 1573 tests, 345s -> 489s.
        #
        # Step ceiling, under the job's. The per-test timeout in the root
        # CMakeLists.txt is what names a wedged test (and lets the rest of
        # the suite keep reporting); this caps the case where many wedge at
        # once, and it fails the step with everything ctest printed up to
        # that point still in the log.
        timeout-minutes: 30
        env:
          # Computed per leg because this step is shared by both. On the leg
          # built without the oracle the variable has no subject at all --
          # LIBRESIGN_HAS_DSS_ORACLE is undefined there, so the stub half of
          # the support library compiles and never reads it.
          LIBRESCRS_REQUIRE_DSS_ORACLE: ${{ matrix.dss_oracle == 'ON' && '1' || '0' }}
        run: |
          # The pipe is removed rather than patched. The runner's default shell
          # for a `run:` step is `bash -e {0}` WITHOUT pipefail, so
          # `ctest ... | tee ctest.log` reports the status of tee: a failed
          # suite showed as a green step, and a check reading that log
          # afterwards passed too. With no pipe there is no question about what
          # the default is. Measured: the old shape exits 0 on a ctest that
          # fails, this one exits 1.
          set +e
          ctest --output-on-failure --test-dir build --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check the skip ledger
        # always(): the ledger's whole point is the run where something did not
        # run, including runs where something also failed.
        if: always()
        run: ./ci/scripts/skip-ledger.sh --check ctest.log ${{ matrix.signing_backend }}

      - name: Upload the ctest log
        # The ledger's verdict is unreadable without the log it judged; a
        # skip that appears only on the runner is diagnosed from this file.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.signing_backend }}
          path: ctest.log
          if-no-files-found: ignore

  build-asan:
    # The core parses APDUs, ASN.1, CMS, SOD and eMRTD structures that come off a
    # card and off the network, vendors OpenSC and miniz, and does manual OpenSSL
    # memory work — and it was the only repository here with no sanitizer pass
    # over its tests at all. fuzz.yml builds with -DBUILD_TESTING=OFF, so it runs
    # zero ctest entries under an instrumented build.
    #
    # Not on pull_request: this leg costs about twenty minutes of build plus four
    # of tests, measured locally at -j4, and the moment code actually lands is the
    # push to main. No continue-on-error: a job that cannot fail the run is not a
    # gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Without a ceiling a wedged sanitizer run burns GitHub's six-hour default.
    timeout-minutes: 90
    env:
      OPENSC_VERSION: '0.26.1'
      # halt_on_error: without it UBSan prints the diagnostic and carries on, so
      # the job stays green with undefined behaviour in the log. The suppression
      # file carries one scoped row, with its reason, for the vendored deflate
      # implementation that reads 32-bit words out of an unaligned byte stream on
      # purpose; every other check stays on for that file.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/ci/ubsan-suppressions.txt
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema \
            softhsm2 opensc \
            poppler-utils

      - name: Build OpenSC ${{ env.OPENSC_VERSION }} from source
        run: |
          git clone --branch ${{ env.OPENSC_VERSION }} --depth 1 \
            https://github.com/OpenSC/OpenSC /tmp/opensc-src
          cd /tmp/opensc-src
          ./bootstrap
          ./configure --prefix=/tmp/opensc-install \
            --enable-shared --disable-static --without-readline
          make -j$(nproc) install

      - name: Configure & Build (address + undefined behaviour sanitizers)
        run: |
          # WERROR off on purpose: this leg measures runtime behaviour, not
          # diagnostics, and the instrumented build raises warnings the plain
          # build does not. The warning floor is judged by its own job.
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON \
            -DLIBREMIDDLEWARE_WERROR=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j4

      # The anti-vacuum, and it is not new: this check refuses an empty listing
      # and refuses a listing with NOT_BUILT placeholders, so "the sanitizer leg
      # was green" and "the sanitizer leg ran nothing" cannot read the same. It
      # compares against the native leg's listing rather than one of its own,
      # because the set of registered cases is a property of the sources, not of
      # the sanitizer: measured, the two listings are byte-identical, and a second
      # copy is a file nobody would keep in step.
      - name: The sanitizer tree registers the same cases as the plain one
        run: ./ci/scripts/test-manifest-gate.sh --check build-asan native

      - name: Bootstrap SoftHSM2 test token
        # The same token store build-linux provisions. Without it the software
        # token suites do not skip here: the module is found, C_Initialize
        # cannot read a configuration and returns CKR_GENERAL_ERROR, and every
        # signing and module-manager case fails. Exports SOFTHSM2_CONF and
        # SOFTHSM2_LIB via $GITHUB_ENV for the step below.
        run: ./ci/scripts/softhsm-bootstrap.sh

      - name: Test under the sanitizers
        # The hardware suites need a reader and self-skip without one; excluding
        # them by name keeps the reason visible instead of relying on the skip.
        # Performance_ is excluded because it asserts a wall-clock median, and
        # instrumentation moves it: measured at 2869 microseconds against a 1000
        # microsecond budget, which is the instrumentation and not the code.
        run: |
          ctest --test-dir build-asan --output-on-failure --no-tests=error \
            --timeout 300 \
            -E "HardwareTest|HwSmoke|RealCard|OpenScBridgeTunnel|Performance_"

  examples-build:
    # Build the SDK-consumer example against the public LibreSCRS surface.
    # Catches regressions where a public header silently grows a dependency
    # on a private/internal header (the consumer-facing entry-point cannot
    # compile any more) or where a header rename/move forgets to update the
    # example.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENSC_VERSION: '0.26.1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema

      - name: Build OpenSC ${{ env.OPENSC_VERSION }} from source
        run: |
          git clone --branch ${{ env.OPENSC_VERSION }} --depth 1 \
            https://github.com/OpenSC/OpenSC /tmp/opensc-src
          cd /tmp/opensc-src
          ./bootstrap
          ./configure --prefix=/tmp/opensc-install \
            --enable-shared --disable-static --without-readline
          make -j$(nproc) install

      - name: Configure with examples enabled (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBRESCRS_BUILD_EXAMPLES=ON \
            -DCMAKE_PREFIX_PATH=/tmp/opensc-install \
            -DOPENSC_INCLUDE_DIR=/tmp/opensc-src/src

      - name: Build sdk-consumer
        run: cmake --build build --target sdk-consumer

      - name: Run sdk-consumer (smoke)
        run: ./build/examples/sdk-consumer/sdk-consumer

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          # autoconf/automake/libtool/pkg-config are required by the vendored
          # OpenSC autoconf bootstrap (thirdparty/opensc-source/bootstrap →
          # autoreconf -fi). Homebrew's ninja covers the LM build itself.
          # softhsm installs libsofthsm2.so under /opt/homebrew/lib/softhsm/
          # — the exact path findSoftHsmPath() already carries as its macOS
          # fallback.
          brew install ninja opensc softhsm autoconf automake libtool pkg-config
          # manifest2header.py hard-fails when jsonschema is missing
          # (the schema gates the codegen step against malformed manifests).
          python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure & Build (Release)
        # Both Linux and macOS CI build Release — matches local
        # pre-tag verification pass and what users receive. Native
        # signing only — DSS is a cross-verification test oracle (per
        # `lib/libresign/CMakeLists.txt`), not the production signing
        # path. The cross-backend coverage runs once, on the Linux
        # `both` leg; duplicating it here would buy no new signal.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Check pimpl visibility
        run: ./ci/scripts/check-impl-visibility.sh build

      - name: Bootstrap SoftHSM2 test token
        # Same store this repo's Linux legs provision — see
        # ci/scripts/softhsm-bootstrap.sh. Exports SOFTHSM2_CONF and
        # SOFTHSM2_LIB via $GITHUB_ENV so the Test step below inherits them.
        run: ./ci/scripts/softhsm-bootstrap.sh

      - name: Test
        # --test-dir build, not build/test: several library subdirectories
        # register their own suites (lib/pkcs15/test, lib/plugin/test,
        # lib/pkcs11/test), and pointing ctest at build/test reads only
        # build/test/CTestTestfile.cmake -- so those ran nowhere. Scoping to
        # the build ROOT runs everything that was built, which is the only
        # scope that cannot silently shed a suite again. Measured on this
        # change: 1409 -> 1573 tests, 345s -> 489s.
        #
        # Step ceiling, under the job's. The per-test timeout in the root
        # CMakeLists.txt is what names a wedged test (and lets the rest of
        # the suite keep reporting); this caps the case where many wedge at
        # once, and it fails the step with everything ctest printed up to
        # that point still in the log.
        timeout-minutes: 30
        run: ctest --output-on-failure --test-dir build --no-tests=error

  shared-config-package:
    # Build LibreMiddleware with LIBREMIDDLEWARE_BUILD_SHARED=ON, install
    # to a workspace prefix, then run examples/sdk-consumer-config/build-and-run.sh
    # which configures + builds + runs a downstream consumer via
    # find_package(LibreMiddleware 5.0 REQUIRED CONFIG). Catches regressions
    # in target export, visibility, version pinning, and bundled-dep
    # linkage end-to-end for shared-library consumers.
    name: SHARED build + Config-package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config cmake ninja-build python3-jsonschema

      - name: Run consumer smoke test
        # build-and-run.sh drives the full install -> consumer-configure
        # -> build -> run cycle and exits ==> OK on success.
        run: bash examples/sdk-consumer-config/build-and-run.sh

      # --- PKCS#11 ownership -------------------------------------------------
      # Registration belongs to the agent proxy. This install must contribute
      # the library and no declaration at all — a property of the finished
      # install tree, not of the rules that produced it, so it is checked by
      # enumerating what p11-kit loads afterwards. The gate script lives in the
      # Linux host repository and serves both invariants through a switch, so
      # neither repository grows a second copy of it. Cross-checkout mirrors
      # what that repository's own CI already does for this one.
      - name: Checkout LibreLinux (for the shared PKCS#11 ownership gate)
        uses: actions/checkout@v4
        with:
          repository: LibreSCRS/LibreLinux
          ref: main
          path: LibreLinux

      - name: Build and install to the system prefix
        # Its own step with its own ceiling: the vendored OpenSC autotools
        # build does not fit inside a gate's budget, and when a step fails its
        # name should say which half failed. LIBRESCRS_VENDOR_OPENSC=OFF
        # because librescrs-pkcs11 is built unconditionally and neither the
        # registration nor the rpath invariant needs the optional fallback
        # provider it adds.
        timeout-minutes: 30
        run: |
          sudo apt-get install -y p11-kit
          cmake -B build-install -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF -DLIBRESCRS_VENDOR_OPENSC=OFF \
                -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-install -j4
          sudo cmake --install build-install

      - name: Assert LM registers no PKCS#11 provider of its own
        timeout-minutes: 5
        run: LibreLinux/e2e/check-p11kit-single-owner.sh --expect none

      - name: Assert the installed module carries a relative rpath
        timeout-minutes: 5
        run: bash ci/scripts/check-pkcs11-rpath.sh /usr

  coverage:
    # Two signing backends. `native` is the production path and carries the
    # release gates; `both` additionally compiles the DSS cross-verification
    # oracle so cross_backend_test.cpp — gated on
    # `LIBRESIGN_HAS_NATIVE && LIBRESIGN_HAS_DSS`, and therefore never built by
    # any job before this matrix existed — is actually exercised.
    # 24.04, not the moving label: the ratchet compares against a
    # baseline recorded under one compiler, and ubuntu-latest moves the
    # compiler with the image. The key would then fail for a reason that
    # has nothing to do with the code. ci/coverage-env.txt records what
    # this is pinned to, and --expect-key below asserts it.
    runs-on: ubuntu-24.04
    # GitHub's default job ceiling is six hours. A deadlocked test once held
    # this job for two hours and forty-nine minutes before a human noticed;
    # the per-test ctest timeout in the root CMakeLists.txt is what names the
    # culprit, and this is the backstop for anything that outlives it (a leaked
    # grandchild holding the output pipe, an apt or clone that stalls). The
    # number is a ceiling, not a budget: well above what dependencies + OpenSC
    # from source + a full Release build + the suite need, and far enough below
    # six hours that a wedge is somebody's problem the same morning.
    env:
      OPENSC_VERSION: '0.26.1'
    # Not on pull_request: this pass costs an hour and the moment a
    # function actually lands is the push to main. Manual only until one
    # measured run says what it really costs on a hosted runner.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The compiler the baseline's key names, installed explicitly and named
      # through CC/CXX. Without this the key is whatever the image happens to
      # ship, which is the thing the pin above exists to stop.
      - name: Pin the compiler the baseline was recorded under
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          echo "GCOV=gcov-13" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema \
            softhsm2 opensc clang \
            poppler-utils

      - name: Build OpenSC ${{ env.OPENSC_VERSION }} from source
        run: |
          git clone --branch ${{ env.OPENSC_VERSION }} --depth 1 \
            https://github.com/OpenSC/OpenSC /tmp/opensc-src
          cd /tmp/opensc-src
          ./bootstrap
          ./configure --prefix=/tmp/opensc-install \
            --enable-shared --disable-static --without-readline
          make -j$(nproc) install


      - name: Install gcovr
        # Pinned: the baseline records the gcovr version it was measured with
        # and the gate refuses to compare across versions, because the exclude
        # semantics that decide the denominator have changed between them.
        run: python3 -m pip install --break-system-packages 'gcovr==8.6'

      - name: Configure (coverage)
        run: cmake --preset coverage -DCMAKE_PREFIX_PATH=/tmp/opensc-install -DOPENSC_INCLUDE_DIR=/tmp/opensc-src/src

      - name: Build
        run: cmake --build build-cov -j4

      - name: Provision the software token
        # Without it roughly forty signing cases skip, and the resulting number
        # is a measurement of the environment, not of the code.
        run: ./ci/scripts/softhsm-bootstrap.sh

      - name: Test
        run: |
          set +e
          ctest --output-on-failure --test-dir build-cov --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check coverage against the baseline
        # The committed baseline was measured with a different compiler than
        # this runner uses, so the FIRST authorised run of this job is expected
        # to refuse to compare and say so. Refusing is the design: a coverage
        # number carries the configuration it was measured under, and comparing
        # across configurations is how a gap becomes an artefact. Record a
        # runner-side baseline with --update, review it in the same commit, and
        # from then on this step is a ratchet.
        run: ./ci/scripts/coverage-gate.py --check --expect-key GNU-13 build-cov

  package:
    # Distribution packages, built in the target distribution's own container.
    #
    # Containers rather than apt/dnf on the runner: ubuntu-latest is one
    # distribution in one version and cannot produce a trixie or an fc43
    # package, and a container makes the same build reproducible with one
    # `docker run` on a development machine.
    #
    # Images are pinned by digest, not by tag. A tag moves under you; a digest
    # does not.
    name: package (${{ matrix.slug }})
    runs-on: ubuntu-latest
    # Measured locally at 45 minutes for the slowest image, times
    # about 2.5. A job with no limit does not fail when it hangs -- it burns
    # hours and hands back no log, because /logs answers 404 while it runs.
    timeout-minutes: 112
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: debian13
            image: debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
          - slug: ubuntu2604
            image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
          - slug: fedora43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out the working tree as the gate will read it
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Nothing upstream: the middleware is the bottom of the chain, which is
      # why its packaging job is the one that gets enabled first.

      - name: Gate
        run: |
          # set +e first: the default shell here is `bash -eo pipefail`, so a
          # failing gate would end the step before its exit code could be read,
          # and the echo below would be dead text pretending to be a measurement.
          set +e
          bash packaging/ci/package-gate.sh "${{ matrix.image }}" "$RUNNER_TEMP/librescrs-packages/out"
          rc=$?
          set -e
          echo "PACKAGE_GATE_RC=$rc"
          test "$rc" = 0

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ runner.temp }}/librescrs-packages/out/${{ matrix.slug }}/**
          if-no-files-found: warn
