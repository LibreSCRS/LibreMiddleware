# SPDX-License-Identifier: LGPL-2.1
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        run: |
          find lib test -name "*.cpp" -o -name "*.h" \
            | xargs clang-format-21 --dry-run --Werror

  build-linux:
    # Two signing backends. `native` is the production path and carries the
    # release gates; `both` additionally compiles the DSS cross-verification
    # oracle so cross_backend_test.cpp — gated on
    # `LIBRESIGN_HAS_NATIVE && LIBRESIGN_HAS_DSS`, and therefore never built by
    # any job before this matrix existed — is actually exercised.
    name: build-linux (${{ matrix.signing_backend }})
    runs-on: ubuntu-latest
    strategy:
      # Each backend must report independently: a `both`-only regression should
      # not mask the production leg's result, and vice versa.
      fail-fast: false
      matrix:
        include:
          - signing_backend: native
            # The DSS oracle shells out to a Java JAR. Kept on for the native
            # leg only because that is where it already ran.
            dss_oracle: 'ON'
            release_gates: true
          - signing_backend: both
            # No Java on the runner: the oracle would be built and never
            # usable. Off here, while the DSS *backend* itself still compiles
            # and the cross-backend cases still run.
            dss_oracle: 'OFF'
            release_gates: false
    env:
      OPENSC_VERSION: '0.26.1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema

      - name: Build OpenSC ${{ env.OPENSC_VERSION }} from source
        run: |
          git clone --branch ${{ env.OPENSC_VERSION }} --depth 1 \
            https://github.com/OpenSC/OpenSC /tmp/opensc-src
          cd /tmp/opensc-src
          ./bootstrap
          ./configure --prefix=/tmp/opensc-install \
            --enable-shared --disable-static --without-readline
          make -j$(nproc) install

      - name: Configure & Build (Release, warnings as errors)
        # Release matches what users receive — same `-O2 -DNDEBUG` code
        # path runs in production and in the local pre-tag verification
        # pass. Debug coverage lives in the developer workflow; the CI
        # gate exists to catch regressions in the shipped configuration.
        # SIGNING_BACKEND is bare (declared in `lib/libresign/CMakeLists.txt`,
        # not namespaced) and BUILD_TESTING defaults ON, so neither is spelled
        # with a project prefix here.
        #
        # LIBREMIDDLEWARE_WERROR covers the shipped libraries and card plugins
        # only: the vendored miniz translation unit, the fetched googletest and
        # this repo's test executables are all left warning-only, so a compiler
        # upgrade cannot fail this build through a diagnostic no change here
        # could fix. Set on both matrix legs — `both` compiles the DSS backend
        # sources that `native` does not. Deliberately not set on the macOS
        # job: the clean baseline this gate rests on was measured with GCC, and
        # AppleClang's diagnostic set is a different one that has never been
        # surveyed. Build type and the option are pinned together here so a
        # later edit to one cannot quietly disarm the other.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/opensc-install \
            -DOPENSC_INCLUDE_DIR=/tmp/opensc-src/src \
            -DSIGNING_BACKEND=${{ matrix.signing_backend }} \
            -DBUILD_DSS_ORACLE=${{ matrix.dss_oracle }} \
            -DLIBREMIDDLEWARE_WERROR=ON
          cmake --build build

      - name: Verify the configured signing backend took effect
        # Runs on every leg — this is the matrix's own integrity check, not a
        # release gate. SIGNING_BACKEND's cached STRINGS property is advisory,
        # so a misspelled flag name above would not fail configure: CMake would
        # record the stray variable, keep the "native" default, and this job
        # would pass forever while silently testing one backend twice.
        run: ./ci/scripts/check-signing-backend.sh build ${{ matrix.signing_backend }} ${{ matrix.dss_oracle }} ON

      - name: Check pimpl visibility
        if: matrix.release_gates
        run: ./ci/scripts/check-impl-visibility.sh build

      - name: Check raw PC/SC open confinement
        if: matrix.release_gates
        # Production code must open the card via CardSession::open (single
        # session per reader); only the diagnostic tools/tests may use the
        # PCSCConnection::openRawDiagnostic escape hatch.
        run: ./ci/scripts/check-raw-pcsc-open.sh

      - name: Check pinned TL cert expiry
        if: matrix.release_gates
        # Pre-empt the runtime hard-fail in tl_signature_verifier.cpp by
        # alerting (build break) ~3 months before any pinned TL signing
        # certificate's notAfter date, giving a comfortable rotation
        # window for the cert refresh + release cut.
        run: ./ci/check-pinned-cert-expiry.sh

      - name: Check ABI snapshot vs 4.x baseline
        # Native leg only: the baseline is recorded for one configuration, and
        # `both` adds the DSS backend's exported symbols, so running it there
        # would report a delta that is not a regression.
        if: matrix.release_gates
        # 4.x baseline — minor-version additions tracked; removals or
        # signature drift forbidden. Additions land via an intentional
        # baseline regeneration (`abi-snapshot.sh --update`) reviewed in
        # the same commit as the new public symbol.
        run: ./ci/scripts/abi-snapshot.sh --check build

      - name: Test
        # No LIBRESCRS_TEST_PIN — CI runner has no smart card. PIN-gated
        # tests skip cleanly via g_pinFailed / SKIP_IF_PIN_FAILED. Real-
        # card validation happens locally on a developer machine before
        # tag.
        # --test-dir build, not build/test: several library subdirectories
        # register their own suites (lib/pkcs15/test, lib/plugin/test,
        # lib/pkcs11/test), and pointing ctest at build/test reads only
        # build/test/CTestTestfile.cmake -- so those ran nowhere. Scoping to
        # the build ROOT runs everything that was built, which is the only
        # scope that cannot silently shed a suite again. Measured on this
        # change: 1409 -> 1573 tests, 345s -> 489s.
        run: ctest --output-on-failure --test-dir build --no-tests=error

  examples-build:
    # Build the SDK-consumer example against the public LibreSCRS surface.
    # Catches regressions where a public header silently grows a dependency
    # on a private/internal header (the consumer-facing entry-point cannot
    # compile any more) or where a header rename/move forgets to update the
    # example.
    runs-on: ubuntu-latest
    env:
      OPENSC_VERSION: '0.26.1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema

      - name: Build OpenSC ${{ env.OPENSC_VERSION }} from source
        run: |
          git clone --branch ${{ env.OPENSC_VERSION }} --depth 1 \
            https://github.com/OpenSC/OpenSC /tmp/opensc-src
          cd /tmp/opensc-src
          ./bootstrap
          ./configure --prefix=/tmp/opensc-install \
            --enable-shared --disable-static --without-readline
          make -j$(nproc) install

      - name: Configure with examples enabled (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBRESCRS_BUILD_EXAMPLES=ON \
            -DCMAKE_PREFIX_PATH=/tmp/opensc-install \
            -DOPENSC_INCLUDE_DIR=/tmp/opensc-src/src

      - name: Build sdk-consumer
        run: cmake --build build --target sdk-consumer

      - name: Run sdk-consumer (smoke)
        run: ./build/examples/sdk-consumer/sdk-consumer

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          # autoconf/automake/libtool/pkg-config are required by the vendored
          # OpenSC autoconf bootstrap (thirdparty/opensc-source/bootstrap →
          # autoreconf -fi). Homebrew's ninja covers the LM build itself.
          brew install ninja opensc autoconf automake libtool pkg-config
          # manifest2header.py hard-fails when jsonschema is missing
          # (the schema gates the codegen step against malformed manifests).
          python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure & Build (Release)
        # Both Linux and macOS CI build Release — matches local
        # pre-tag verification pass and what users receive. Native
        # signing only — DSS is a cross-verification test oracle (per
        # `lib/libresign/CMakeLists.txt`), not the production signing
        # path. The cross-backend coverage runs once, on the Linux
        # `both` leg; duplicating it here would buy no new signal.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Check pimpl visibility
        run: ./ci/scripts/check-impl-visibility.sh build

      - name: Test
        # --test-dir build, not build/test: several library subdirectories
        # register their own suites (lib/pkcs15/test, lib/plugin/test,
        # lib/pkcs11/test), and pointing ctest at build/test reads only
        # build/test/CTestTestfile.cmake -- so those ran nowhere. Scoping to
        # the build ROOT runs everything that was built, which is the only
        # scope that cannot silently shed a suite again. Measured on this
        # change: 1409 -> 1573 tests, 345s -> 489s.
        run: ctest --output-on-failure --test-dir build --no-tests=error

  shared-config-package:
    # Build LibreMiddleware with LIBREMIDDLEWARE_BUILD_SHARED=ON, install
    # to a workspace prefix, then run examples/sdk-consumer-config/build-and-run.sh
    # which configures + builds + runs a downstream consumer via
    # find_package(LibreMiddleware 4.0 REQUIRED CONFIG). Catches regressions
    # in target export, visibility, version pinning, and bundled-dep
    # linkage end-to-end for shared-library consumers.
    name: SHARED build + Config-package consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config cmake ninja-build python3-jsonschema

      - name: Run consumer smoke test
        # build-and-run.sh drives the full install -> consumer-configure
        # -> build -> run cycle and exits ==> OK on success.
        run: bash examples/sdk-consumer-config/build-and-run.sh
