# SPDX-License-Identifier: LGPL-2.1-or-later
name: CodeQL

# GitHub CodeQL static analysis for the C++ surface, on every PR plus a
# weekly schedule. Catches common security antipatterns (buffer/integer
# issues, null deref, format-string, command injection) and CWE-mapped
# findings beyond what -Wall -Wextra -Wpedantic surfaces.

on:
  # Not on push: half an hour per run, and a change reaches main through a
  # pull request, where this already ran.
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:00 UTC — picks up new query packs without blocking PRs
    # if the queries themselves change between runs.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    timeout-minutes: 60
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write


    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcsclite-dev libssl-dev zlib1g-dev \
            libcurl4-openssl-dev libxml2-dev \
            pkg-config autoconf automake libtool \
            cmake ninja-build python3-jsonschema \
            libgtest-dev libgmock-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: cpp
          # security-and-quality is the broader pack (security + lint);
          # security-extended is security-only with extended coverage.
          queries: security-and-quality
          # Exclude thirdparty/ (vendored upstream OpenSC) — those alerts
          # are not LibreSCRS-authored code; see .github/codeql/codeql-config.yml
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure & Build
        # Manual build path, as build-linux builds: the vendored OpenSC is
        # built inside the CMake build, so CodeQL observes its compile graph.
        run: |
          cmake -B build -G Ninja
          cmake --build build -j4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:cpp"
