#
# Performance regression gate. Builds the benchmark targets, compares each
# candidate JSON run against the committed bench/baselines/4.2-*.json
# reference with ci/scripts/bench-regression-gate.sh, and fails the job
# on a cpu_time regression past BENCH_REGRESSION_THRESHOLD_PCT. The raw
# JSON is still uploaded on both pass and fail so a flagged run can be
# inspected without re-running CI.

name: Bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bench:
    name: Google Benchmark
    runs-on: ubuntu-latest
    env:
      # See ci/scripts/bench-regression-gate.sh and bench/README.md for
      # why 20% and why cpu_time.
      BENCH_REGRESSION_THRESHOLD_PCT: "20"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libcurl4-openssl-dev libssl-dev libxml2-dev libpcsclite-dev \
            uuid-dev openssl python3-jsonschema

      - name: Configure
        run: |
          cmake -B build-bench -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSIGNING_BACKEND=both \
            -DLIBRESCRS_BUILD_BENCH=ON \
            -DBUILD_TESTING=OFF

      - name: Build
        # bench_signing is gated on SoftHSM availability and not built in
        # the default LibreSCRS_BUILD_BENCH=ON configuration; the four
        # released bench binaries cover ParsedCertificate, validateChain
        # depth 1/3/5, and TrustStoreService::create. Re-add to the
        # target list when the bench harness for SigningService::sign
        # B-B/B-T levels lands (planned follow-up).
        run: |
          cmake --build build-bench \
            --target bench_parsed_cert bench_trust_validate \
                     bench_truststore_service \
            -j2

      - name: Run
        run: |
          mkdir -p bench-results
          for b in bench_parsed_cert bench_trust_validate \
                   bench_truststore_service; do
              ./build-bench/bench/$b \
                  --benchmark_min_time=0.5s \
                  --benchmark_format=json \
                  --benchmark_out=bench-results/$b.json || true
          done

      - name: Compare against baseline
        run: |
          status=0
          for b in bench_parsed_cert bench_trust_validate \
                   bench_truststore_service; do
              echo "::group::$b vs bench/baselines/4.2-$b.json"
              ci/scripts/bench-regression-gate.sh \
                  "bench/baselines/4.2-$b.json" \
                  "bench-results/$b.json" \
                  "$BENCH_REGRESSION_THRESHOLD_PCT" || status=1
              echo "::endgroup::"
          done
          exit $status

      # Runs even when the comparison above fails, so a flagged regression
      # can still be inspected from the job's artifact instead of only its
      # log.
      - name: Upload bench JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
