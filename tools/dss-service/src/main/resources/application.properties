# Socket path passed via --server.socket-path=<path>
# When socket-path is set, the server binds to a Unix domain socket instead of TCP.
server.port=0
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.eu.europa.esig.dss=DEBUG
logging.level.io.librescrs.dss=INFO

# Allow large document payloads (WebFlux multipart binary upload)
spring.codec.max-in-memory-size=256MB
